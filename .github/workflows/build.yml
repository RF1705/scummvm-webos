name: Build webOS IPK

on:
  push:
    branches:
      - main
    tags:
      - 'scummvm_*_webos_*'
  pull_request:
  workflow_dispatch:
    inputs:
      scummvm_ref:
        description: Official ScummVM tag or commit
        required: true
        default: v2026.3.0

permissions:
  contents: read

concurrency:
  group: webos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCUMMVM_REF: ${{ inputs.scummvm_ref || 'v2026.3.0' }}
  SDK_ARCHIVE: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  SDL2_ARCHIVE_URL: https://github.com/webosbrew/SDL-webOS/releases/download/release-2.30.12-webos.1/SDL2-2.30.12-webos-abi.tar.gz
  WEBOS_PACKAGE_VERSION: 2026.3.0
  WEBOS_BUILD_SUFFIX: webos1.1.0

jobs:
  build:
    name: ARMv7 codec package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: ${{ env.SCUMMVM_REF }}
          path: upstream
          fetch-depth: 1

      - name: Validate repository scripts
        run: |
          bash -n scripts/build-codecs.sh
          bash -n scripts/build-webos.sh
          bash -n scripts/package-webos.sh

      - name: Download webOS build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          gh release download \
            --repo webosbrew/ares-cli-rs \
            --pattern 'ares-package_*_amd64.deb' \
            --dir "$RUNNER_TEMP/downloads"
          gh release download \
            --repo openlgtv/buildroot-nc4 \
            --pattern "$SDK_ARCHIVE" \
            --dir "$RUNNER_TEMP/downloads"
          curl --fail --location --retry 3 \
            "$SDL2_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/downloads/sdl2.tar.gz"

      - name: Install webOS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xz-utils \
            "$RUNNER_TEMP"/downloads/ares-package_*_amd64.deb
          mkdir -p "$RUNNER_TEMP/webos-ndk" "$RUNNER_TEMP/sdl2"
          tar -xzf "$RUNNER_TEMP/downloads/$SDK_ARCHIVE" \
            -C "$RUNNER_TEMP/webos-ndk" \
            --strip-components=1
          "$RUNNER_TEMP/webos-ndk/relocate-sdk.sh"
          tar -xzf "$RUNNER_TEMP/downloads/sdl2.tar.gz" \
            -C "$RUNNER_TEMP/sdl2"

      - name: Restore static codec cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/webos-codecs
            ${{ runner.temp }}/codec-sources/downloads
          key: webos-codecs-${{ runner.os }}-${{ env.SDK_ARCHIVE }}-${{ hashFiles('scripts/build-codecs.sh') }}

      - name: Build static audio and video codecs
        shell: bash
        run: |
          source "$RUNNER_TEMP/webos-ndk/environment-setup"
          CODEC_SOURCE_DIR="$RUNNER_TEMP/codec-sources" \
            CODEC_PREFIX="$RUNNER_TEMP/webos-codecs" \
            bash scripts/build-codecs.sh

      - name: Build ScummVM
        shell: bash
        run: |
          source "$RUNNER_TEMP/webos-ndk/environment-setup"
          SCUMMVM_SOURCE_DIR="$GITHUB_WORKSPACE/upstream" \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            CODEC_PREFIX="$RUNNER_TEMP/webos-codecs" \
            bash scripts/build-webos.sh

      - name: Package IPK
        shell: bash
        run: |
          source "$RUNNER_TEMP/webos-ndk/environment-setup"
          SCUMMVM_SOURCE_DIR="$GITHUB_WORKSPACE/upstream" \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            DIST_DIR="$GITHUB_WORKSPACE/dist" \
            SDL2_BUNDLE_DIR="$RUNNER_TEMP/sdl2" \
            bash scripts/package-webos.sh

      - name: Inspect package
        run: |
          ls -lh dist/*.ipk dist/*.sha256
          file dist/package/scummvm dist/package/scummvm.bin dist/package/lib/*
          test -s dist/package/fonts.dat
          test -s dist/package/translations.dat
          test -s dist/package/scummremastered.zip
          test -s dist/package/lib/libjpeg.so.8
          for archive in \
            libogg.a \
            libvorbis.a \
            libvorbisfile.a \
            libFLAC.a \
            libmad.a \
            libmpeg2.a \
            libmpeg2convert.a \
            libtheora.a \
            libtheoradec.a; do
            test -s "$RUNNER_TEMP/webos-codecs/lib/$archive"
          done
          grep -E '^#define (USE_OGG|USE_VORBIS|USE_FLAC|USE_MAD|USE_MPEG2|USE_THEORADEC)' \
            build/config.h
          cat dist/*.sha256

      - name: Generate Homebrew Channel manifest
        shell: bash
        run: |
          ipk="$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"
          ipk_name="$(basename "$ipk")"
          ipk_hash="$(sha256sum "$ipk" | cut -d ' ' -f 1)"
          ipk_size="$(stat -c '%s' "$ipk")"
          jq -n \
            --arg id "org.scummvm.scummvm" \
            --arg version "$WEBOS_PACKAGE_VERSION" \
            --arg type "native" \
            --arg title "ScummVM" \
            --arg appDescription "Classic adventure game engine" \
            --arg iconUri "https://raw.githubusercontent.com/scummvm/scummvm/v2026.3.0/dists/emscripten/assets/scummvm-192.png" \
            --arg sourceUrl "https://github.com/$GITHUB_REPOSITORY" \
            --arg ipkUrl "$ipk_name" \
            --arg sha256 "$ipk_hash" \
            --argjson ipkSize "$ipk_size" \
            '{
              id: $id,
              version: $version,
              type: $type,
              title: $title,
              appDescription: $appDescription,
              iconUri: $iconUri,
              sourceUrl: $sourceUrl,
              ipkUrl: $ipkUrl,
              ipkHash: {sha256: $sha256},
              ipkSize: $ipkSize
            }' > dist/org.scummvm.scummvm.manifest.json
          jq . dist/org.scummvm.scummvm.manifest.json

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-webos-v${{ env.WEBOS_PACKAGE_VERSION }}-${{ env.WEBOS_BUILD_SUFFIX }}-${{ github.sha }}-arm
          path: |
            dist/*.ipk
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'scummvm_')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: scummvm-webos-v${{ env.WEBOS_PACKAGE_VERSION }}-${{ env.WEBOS_BUILD_SUFFIX }}-${{ github.sha }}-arm
          path: release

      - name: Verify release artifact
        shell: bash
        run: |
          cd release
          sha256sum --check *.sha256
          manifest_ipk="$(jq -r '.ipkUrl' org.scummvm.scummvm.manifest.json)"
          manifest_hash="$(jq -r '.ipkHash.sha256' org.scummvm.scummvm.manifest.json)"
          test -f "$manifest_ipk"
          test "$manifest_hash" = "$(sha256sum "$manifest_ipk" | cut -d ' ' -f 1)"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.ipk \
            release/*.sha256 \
            release/*.manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "ScummVM $WEBOS_PACKAGE_VERSION for rooted LG webOS TVs. Includes statically linked Ogg Vorbis, MP3, FLAC, MPEG-1/2 and Theora support. Built and verified by GitHub Actions from $GITHUB_SHA."
