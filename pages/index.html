<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScummVM webOS Spielstarter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>ScummVM-Spielstarter erstellen</h1>
    <p>Erzeugt lokal im Browser eine installierbare webOS-IPK. Das Icon wird nicht hochgeladen.</p>

    <form id="generator">
      <label>ScummVM Target-ID
        <input id="target" name="target" required maxlength="64" pattern="[A-Za-z0-9_-]+" placeholder="monkey1">
      </label>
      <label>Anzeigename
        <input id="title" name="title" required maxlength="80" placeholder="The Secret of Monkey Island">
      </label>
      <label>Icon
        <input id="icon" name="icon" type="file" required accept="image/png,image/jpeg,image/webp,image/svg+xml">
      </label>
      <output id="app-id">org.scummvm.launcher.…</output>
      <button type="submit">IPK erstellen</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">Die Target-ID muss bereits in der zentralen ScummVM-Installation eingerichtet sein.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" integrity="sha384-KX4T6KjLPeXFcV3aJ9gS5T8n09f1Jbe5xN9wr7l/zbYhaS6D+u1O6oM6S7Qd5Q2x" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
